[api]
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
port = 55329

[studio]
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
port = 55324

[analytics]
port = 55327

[edge_runtime]
inspector_port = 55328

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://127.0.0.1:8080"]

[functions.parent-pin]
# Validation is performed explicitly with auth.getUser(token) in the handler.
# This supports the project's current signing keys without relying on the legacy gateway check.
verify_jwt = false

[functions.families]
# Every request is authenticated by auth.getUser(token) in the handler.
verify_jwt = false

[functions.child-sessions]
# Adult login validates Auth server-side; child endpoints validate opaque session tokens.
verify_jwt = false

[functions.worksheets]
# Adult routes require Auth + parental unlock; child listing validates opaque sessions.
verify_jwt = false

[functions.attempts]
# All routes require an opaque child token, validated atomically inside the RPC.
verify_jwt = false

[functions.reviews]
# Parent-only routes validate adult Auth and the temporary parental unlock inside RPC.
verify_jwt = false

[functions.progress]
# Adult Auth and parental unlock are validated explicitly in the handler and RPCs.
verify_jwt = false

[functions.legal]
# Documents are public; acceptance routes validate adult Auth with auth.getUser(token).
verify_jwt = false

[functions.account]
# Account deletion validates Auth with auth.getUser(token) and requires a recent password sign-in.
verify_jwt = false
