openapi: 3.0.3
info:
  title: Escola em Dia — Catálogo e atribuições
  version: 1.0.0
  description: >-
    Subconjunto do contrato acordado. Não gera perguntas nem versões a partir
    do cliente: propõe fichas publicadas cujos temas correspondem exatamente
    à seleção. As versões publicadas e as suas associações a temas são imutáveis.
    Todas as listas são paginadas (50 itens) por UUID crescente e nextCursor,
    exceto o catálogo (/v1/worksheets), ordenado Free → Premium com cursor
    opaco "<tier>.<versionId>".
    Os metadados de cada ficha incluem accessTier (free | premium).
servers:
  - url: https://hhgxxvvreyhigxynrgmv.supabase.co/functions/v1/worksheets
security:
  - adultJwt: []
    parentUnlock: []
    projectKey: []
paths:
  /v1/subjects:
    get:
      summary: Listar disciplinas do catálogo
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: items com id e name; nextCursor UUID ou null
        default:
          $ref: '#/components/responses/Error'
  /v1/topics:
    get:
      summary: Listar temas por disciplina e ano escolar
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: schoolYear
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 9
      responses:
        '200':
          description: items com id, name, subjectId e schoolYear; nextCursor UUID ou null
        default:
          $ref: '#/components/responses/Error'
  /v1/worksheets:
    get:
      summary: Procurar propostas no catálogo publicado
      parameters:
        - name: cursor
          in: query
          description: nextCursor opaco da página anterior ("<tier>.<versionId>")
          schema:
            type: string
        - name: accessTier
          in: query
          description: Filtrar por catálogo Free ou Premium
          schema:
            type: string
            enum: [free, premium]
        - name: childId
          in: query
          description: >-
            Criança da família do responsável. Quando indicada, cada item traz
            childHistory {timesCompleted, lastCompletedAt} com as tentativas entregues
            dessa criança na ficha (todas as versões). Criança de outra família → 404 CHILD_NOT_FOUND.
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: schoolYear
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 9
        - name: topicIds
          in: query
          description: UUIDs separados por vírgulas, máximo 20; correspondência exata dos temas
          schema:
            type: string
      responses:
        '200':
          description: >-
            items com metadados da última versão publicada de cada ficha (inclui accessTier),
            primeiro as fichas Free e depois as Premium; nextCursor opaco ou null; com childId,
            cada item inclui childHistory
        default:
          $ref: '#/components/responses/Error'
  /v1/worksheets/{id}:
    get:
      summary: Pré-visualizar uma versão publicada, exclusivamente para adultos desbloqueados
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: query
          schema:
            type: string
            format: uuid
          description: Versão exata da proposta; na ausência, utiliza a última publicada
      responses:
        '200':
          description: Metadados e content JSONB completo. Nunca permitido a sessão infantil.
        default:
          $ref: '#/components/responses/Error'
  /v1/children/{id}/assignments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Listar atribuições ativas da criança
      security:
        - adultJwt: []
          parentUnlock: []
          projectKey: []
        - childToken: []
          projectKey: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: >-
            items com id, childId, worksheetVersionId, assignedAt, status, activeAttemptId, latestAttemptId, latestAttemptStatus, latestAttemptNumber, latestCompletedAttemptId e latestCompletedAttemptNumber (ou null) e worksheet
            (metadados apenas, inclui accessTier); nextCursor UUID ou null; access com o plano e a
            utilização do dia: plan (premium | free | locked), subscription, assignmentsToday,
            assignmentLimit, attemptsToday, attemptLimit (null = ilimitado), freeMaxQuestions e
            catalogue (all | free | none). Não contém ofertas. Adulto deve ser membro da família.
            Sessão infantil só pode consultar o próprio id. Não inclui perguntas,
            soluções, explicações ou critérios de classificação.
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Disponibilizar uma versão de ficha à criança
      description: >-
        Transação valida autorização do responsável, membro/família ativos e ano escolar,
        grava a atribuição e auditoria em conjunto. Repetir o mesmo clientRequestId
        não duplica a atribuição. Uma versão só pode estar ativa uma vez por criança.
        Plano (403): CHILD_PLAN_LOCKED (criança sem vaga gratuita nem Premium),
        PREMIUM_WORKSHEET_REQUIRED (ficha Premium para criança Free) e
        DAILY_ASSIGNMENT_LIMIT_REACHED (limite diário do plano gratuito, dia de Lisboa;
        fichas retiradas antes de iniciadas não contam). O cliente deve apresentar o Premium.
        A realização e repetição da ficha serão representadas por tentativas futuras.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId, worksheetVersionId]
              properties:
                clientRequestId:
                  type: string
                  format: uuid
                worksheetVersionId:
                  type: string
                  format: uuid
                writtenAnswerMode:
                  type: string
                  enum: [typed, paper]
                  default: typed
                  description: >-
                    Onde a criança responde às perguntas abertas, decidido pelo responsável:
                    typed (escreve na app) ou paper (resolve no caderno). A criança não pode alterar.
                    Repetir o mesmo clientRequestId com outro modo devolve REQUEST_CONFLICT.
      responses:
        '201':
          description: id, childId, worksheetVersionId, assignedAt, status e writtenAnswerMode da atribuição confirmada
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
      description: nextCursor da página anterior
  securitySchemes:
    adultJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    parentUnlock:
      type: apiKey
      in: header
      name: X-Parent-Unlock
    projectKey:
      type: apiKey
      in: header
      name: apikey
    childToken:
      type: http
      scheme: bearer
      description: Token opaco chd_, validado pela API
  responses:
    Error:
      description: >-
        error com code/message/requestId. 400 pedido inválido, 401 sessão inválida,
        403 área do responsável bloqueada, 404 perfil/ficha inacessível, 409 pedido reutilizado
        ou atribuição já ativa, 422 ano escolar incompatível, 503 indisponibilidade,
        500 erro interno. Não devolve detalhes da base de dados.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, requestId]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                    format: uuid
