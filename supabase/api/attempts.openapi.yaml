openapi: 3.0.3
info:
  title: Escola em Dia — Tentativas e respostas
  version: 1.3.0
  description: >-
    Iniciar/retomar, guardar respostas, entregar e consultar o resumo da própria criança.
    Apenas tokens infantis opacos são aceites. Correção objetiva feita no servidor;
    respostas abertas preenchidas aguardam revisão. Repetição explícita após conclusão
    usa a mesma atribuição e versão, com uma tentativa nova e respostas em branco.
    Correção detalhada disponível apenas para a própria tentativa completed através
    de /feedback; os payloads de início, edição e resumo mantêm-se sem soluções.
    A sincronização em lote continua pendente.
servers:
  - url: https://hhgxxvvreyhigxynrgmv.supabase.co/functions/v1/attempts
security:
  - childToken: []
    projectKey: []
paths:
  /v1/assignments/{id}/attempts:
    post:
      summary: Iniciar, retomar ou repetir explicitamente uma ficha concluída
      description: >-
        A atribuição deve pertencer à criança da sessão. Um novo pedido só inicia
        uma tentativa se não houver outra em progresso. Todos os clientRequestId
        usados para iniciar/retomar ficam associados à tentativa em sync_operations,
        de forma que repetir o mesmo pedido nunca inicia outra tentativa. Para repetir
        a ficha, enviar previousAttemptId da última tentativa completed e um novo
        clientRequestId. O servidor valida a pertença e o estado; a ficha deve continuar
        atribuída. Havendo uma tentativa em curso, retoma essa tentativa. Uma origem
        completed desatualizada, sem tentativa em curso, devolve REPEAT_STATE_CHANGED.
        Sem previousAttemptId, uma atribuição já entregue devolve a tentativa existente
        em leitura em vez de criar uma repetição implícita. Uma tentativa nova não copia
        respostas nem classificações. attemptNumber é sequencial por atribuição.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId]
              properties:
                clientRequestId:
                  type: string
                  format: uuid
                previousAttemptId:
                  type: string
                  format: uuid
                  description: Opcional. ID da última tentativa concluída para pedir uma repetição explícita.
      responses:
        '201':
          description: Tentativa iniciada ou retomada, com payload infantil sanitizado e respostas guardadas
        default:
          $ref: '#/components/responses/Error'
  /v1/attempts/{id}/feedback:
    get:
      summary: Consultar a correção de uma tentativa própria concluída
      description: >-
        Exclusivo da sessão infantil titular. Apenas status completed; uma tentativa
        em curso, submitted ou pending_review não fornece correção detalhada.
        Devolve summary, instructions/text/audioText e questions em ordem original.
        As respostas são as entregues no servidor, nunca rascunhos locais.
        Inclui texto da opção correta e explicação publicada só para escolhas múltiplas.
        Nas abertas, apenas resposta própria e classificação parental atual, sem solução
        inventada, critérios privados, identidade do adulto ou histórico de revisões.
        A correção de uma realização anterior completed pode ser consultada enquanto
        outra realização está em curso; não altera nenhuma das tentativas.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correção própria concluída, sem cache; atualizar relê as classificações atuais.
          content:
            application/json:
              schema:
                type: object
                required: [summary, instructions, text, audioText, questions]
                properties:
                  summary:
                    type: object
                    description: Resumo agregado da entrega com attemptId, childId, attemptNumber e status completed.
                  instructions:
                    type: string
                  text:
                    type: string
                  audioText:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      required: [id, number, type, prompt, answerType, answerText, outcome, explanation, selectedOptionText, correctOptionText]
                      properties:
                        id:
                          type: string
                        number:
                          type: integer
                          minimum: 1
                        type:
                          type: string
                          enum: [multiple-choice, written, true_false]
                        prompt:
                          type: string
                        answerType:
                          type: string
                          enum: [multiple-choice, typed, paper, unanswered, true_false]
                        answerText:
                          type: string
                        outcome:
                          type: string
                          enum: [correct, partially_correct, incorrect, unanswered, pending_review]
                        selectedOptionText:
                          type: string
                          nullable: true
                        correctOptionText:
                          type: string
                          nullable: true
                        explanation:
                          type: string
        '409':
          description: FEEDBACK_NOT_AVAILABLE; a tentativa ainda não está completed. Sem respostas ou soluções no erro.
        default:
          $ref: '#/components/responses/Error'
  /v1/attempts/{id}:
    get:
      summary: Consultar tentativa e respostas da própria criança
      description: >-
        Inclui id, attemptNumber, assignmentId, childId, worksheetVersionId, status, startedAt,
        writable, title, subjectName, instructions, text, audioText, questions e answers.
        As perguntas incluem apenas id/type/prompt e opções id/text; não incluem
        correctAnswer, explanation ou outros campos reservados.
        Uma tentativa de atribuição retirada continua consultável, mas não editável.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payload da tentativa sem soluções ou critérios de correção
        default:
          $ref: '#/components/responses/Error'
  /v1/attempts/{id}/answers/{questionId}:
    put:
      summary: Guardar resposta com idempotência e revisão otimista
      description: >-
        A operação e a resposta são confirmadas na mesma transação. Antes da
        primeira gravação, baseRevision é 0. Cada gravação incrementa a revisão.
        O mesmo operationId e conteúdo devolvem o resultado original; reutilizá-lo
        com outros dados é um conflito. Respostas só mudam numa tentativa in_progress
        e com atribuição ativa. Limpar a resposta usa mode unanswered e preserva a revisão.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: questionId
          in: path
          required: true
          schema:
            type: string
          description: ID da pergunta dentro da versão, codificado como segmento URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, baseRevision, answer]
              properties:
                operationId:
                  type: string
                  format: uuid
                baseRevision:
                  type: integer
                  minimum: 0
                  maximum: 2147483646
                answer:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [mode, selectedOptionId]
                      properties:
                        mode:
                          type: string
                          enum: [multiple-choice]
                        selectedOptionId:
                          type: string
                    - type: object
                      additionalProperties: false
                      required: [mode, value]
                      properties:
                        mode:
                          type: string
                          enum: [true_false]
                        value:
                          type: boolean
                          description: Verdadeiro (true) ou Falso (false)
                    - type: object
                      additionalProperties: false
                      required: [mode, text]
                      properties:
                        mode:
                          type: string
                          enum: [typed]
                        text:
                          type: string
                          maxLength: 5000
                    - type: object
                      additionalProperties: false
                      required: [mode]
                      properties:
                        mode:
                          type: string
                          enum: [paper, unanswered]
      responses:
        '200':
          description: answerId, revision, syncStatus confirmed e updatedAt
        '409':
          description: Conflito de revisão/operação ou tentativa não editável; erro inclui currentRevision quando aplicável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Error'
  /v1/attempts/{id}/submit:
    post:
      summary: Confirmar entrega e congelar respostas numa transação
      description: >-
        Exige sessão infantil válida e atribuição ativa. Valida que as revisões
        de TODAS as perguntas ainda são as que a criança confirmou. Classifica
        escolhas múltiplas a partir da versão imutável, define submittedAt e status
        pending_review ou completed, regista auditoria e idempotência atomicamente.
        As respostas abertas em branco não recebem revisão. Não armazena nota global.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, expectedRevisions]
              properties:
                operationId:
                  type: string
                  format: uuid
                expectedRevisions:
                  type: object
                  minProperties: 1
                  maxProperties: 50
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  description: Mapa de questionId para revisão; 0 quando não existe resposta gravada
      responses:
        '200':
          description: Entrega confirmada com resumo calculado no servidor
        '409':
          description: ATTEMPT_REVISION_CONFLICT, tentativa já fechada ou identificador reutilizado
        default:
          $ref: '#/components/responses/Error'
  /v1/attempts/{id}/result:
    get:
      summary: Consultar resumo de entrega já confirmada da própria criança
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: >-
            attemptId, assignmentId, childId, status, submittedAt, title,
            subjectName, questionCount, choiceTotal, choiceCorrect, choiceUnanswered,
            attemptNumber, writtenTotal, writtenAnswered, writtenCorrect, writtenPartial, writtenIncorrect, pendingReview e unansweredTotal.
            Não inclui soluções, critérios ou respostas corretas por pergunta.
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    childToken:
      type: http
      scheme: bearer
      description: Token opaco chd_, validado pelo RPC em cada transação; JWT adulto não aceite
    projectKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
            details:
              type: object
              properties:
                currentRevision:
                  type: integer
  responses:
    Error:
      description: >-
        Erro code/message/requestId. 400 pedido inválido, 401 sessão infantil inválida,
        404 tentativa/pergunta inacessível, 409 conflito ou tentativa só de leitura,
        422 resposta inválida, 503 indisponibilidade e 500 erro interno.
        REPEAT_NOT_AVAILABLE (409) quando a origem não está concluída ou não pertence
        à mesma atribuição; REPEAT_STATE_CHANGED (409) quando existe uma tentativa
        posterior e a lista precisa de atualização. OPERATION_REUSED (409) se o mesmo
        identificador for usado com conteúdo diferente.
        Não inclui respostas completas nos logs ou erros.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
