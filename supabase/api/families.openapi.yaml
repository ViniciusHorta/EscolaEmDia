openapi: 3.0.3
info:
  title: Escola em Dia — Famílias e crianças
  version: 1.3.0
  description: >-
    GET/POST /v1/families, GET/POST /v1/families/{id}/children, PUT
    /v1/families/{id}/children/{childId} e vários responsáveis por família
    (members, invitations). Adultos usam Supabase Auth. Nenhuma resposta
    inclui PINs, hashes ou tokens de convite. Todos os responsáveis têm as
    mesmas permissões; máximo de 4 por família (contando convites pendentes
    válidos) e 10 convites por família em 24 h. Encerramento de família ainda
    não está implementado.
servers:
  - url: https://hhgxxvvreyhigxynrgmv.supabase.co/functions/v1/families
security:
  - adultSession: []
    projectKey: []
paths:
  /v1/families:
    get:
      summary: Listar famílias ativas das quais o adulto é membro ativo
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: items contém famílias; nextCursor é UUID ou null, máximo 50 itens
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                  nextCursor:
                    type: string
                    format: uuid
                    nullable: true
        default:
          $ref: '#/components/responses/Error'
    post:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Criar família e associar o adulto numa única transação
      description: >-
        Exige e-mail confirmado e PIN do responsável configurado. Repetir o mesmo
        clientRequestId para o mesmo adulto devolve a mesma família sem
        criar outra associação ou evento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId]
              properties:
                clientRequestId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Família criada ou pedido repetido de forma idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/children:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Listar crianças da família autorizada
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lista paginada de perfis, máximo 50 itens
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
                  nextCursor:
                    type: string
                    format: uuid
                    nullable: true
        default:
          $ref: '#/components/responses/Error'
    post:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Criar perfil e credencial infantil numa única transação
      description: >-
        Requer adulto membro ativo e família ativa, e-mail confirmado e PIN do
        responsável configurado. clientRequestId é também o UUID do perfil.
        Repetir o mesmo pedido não duplica o perfil. Reutilizar o identificador
        com outros dados devolve 409 REQUEST_CONFLICT. O PIN só é enviado
        por HTTPS à função e não é devolvido ou persistido no Flutter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId, displayName, schoolYear, avatarId, pin]
              properties:
                clientRequestId:
                  type: string
                  format: uuid
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 40
                schoolYear:
                  type: integer
                  minimum: 1
                  maximum: 9
                avatarId:
                  type: string
                  enum: [fox, owl, bear, lynx, dolphin, rabbit]
                pin:
                  type: string
                  pattern: '^[0-9]{4}$'
                  writeOnly: true
      responses:
        '201':
          description: Perfil guardado ou pedido repetido de forma idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/children/{childId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: childId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Alterar alcunha, ano escolar, avatar e, opcionalmente, o PIN infantil
      description: >-
        Requer adulto membro ativo da família e área do responsável desbloqueada.
        pin ausente ou null mantém o PIN atual. Com pin, o hash é substituído,
        as sessões infantis ativas são revogadas e o bloqueio de tentativas é
        limpo. A auditoria regista apenas os nomes dos campos alterados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, schoolYear, avatarId]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 40
                schoolYear:
                  type: integer
                  minimum: 1
                  maximum: 9
                avatarId:
                  type: string
                  enum: [fox, owl, bear, lynx, dolphin, rabbit]
                pin:
                  type: string
                  nullable: true
                  pattern: '^[0-9]{4}$'
                  writeOnly: true
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      summary: Responsáveis ativos e convites pendentes da família
      responses:
        '200':
          description: Lista completa (sem paginação; no máximo 4 responsáveis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMembers'
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/members/{adultUserId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - name: adultUserId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Remover um responsável, ou sair da família quando é o próprio
      description: >-
        Nunca remove o último responsável ativo (409 LAST_MEMBER). As sessões de
        criança autorizadas pelo adulto removido deixam de ser válidas.
      responses:
        '200':
          description: Responsável removido (removed) ou saída do próprio (left)
          content:
            application/json:
              schema:
                type: object
                required: [adultUserId, status]
                properties:
                  adultUserId: {type: string, format: uuid}
                  status: {type: string, enum: [removed, left]}
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/invitations:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Convidar um adulto por e-mail
      description: >-
        Gera um token de uso único (válido 7 dias) e envia o link
        INVITE_BASE_URL?token=… por e-mail. Só o SHA-256 do token é guardado.
        Reenviar para o mesmo e-mail cancela o convite pendente anterior. Se o
        e-mail não puder ser enviado, o convite é cancelado (503 EMAIL_UNAVAILABLE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '201':
          description: Convite criado e e-mail enviado
          content:
            application/json:
              schema:
                type: object
                required: [id, email, status, createdAt, expiresAt]
                properties:
                  id: {type: string, format: uuid}
                  email: {type: string, format: email}
                  status: {type: string, enum: [pending]}
                  createdAt: {type: string, format: date-time}
                  expiresAt: {type: string, format: date-time}
        default:
          $ref: '#/components/responses/Error'
  /v1/families/{id}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      security:
        - adultSession: []
          projectKey: []
          parentUnlock: []
      summary: Cancelar um convite pendente
      responses:
        '200':
          description: Convite cancelado
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [cancelled]}
        default:
          $ref: '#/components/responses/Error'
  /v1/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      security:
        - projectKey: []
      summary: Ver um convite (público; o token é o segredo)
      description: >-
        Usado no ecrã de entrada antes do login. accountExists indica se o e-mail
        convidado já tem conta, para a app abrir em Entrar ou Criar conta.
        Convites cancelados ou inexistentes devolvem 404 INVITATION_INVALID.
      responses:
        '200':
          description: Dados do convite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        default:
          $ref: '#/components/responses/Error'
  /v1/invitations/{token}/signup:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      security:
        - projectKey: []
      summary: Criar a conta do convidado já com o e-mail confirmado
      description: >-
        Só para convites pendentes cujo e-mail ainda não tem conta. O token prova
        que o convidado recebeu o e-mail, por isso a conta é criada confirmada
        com o e-mail do convite. legalDocumentIds segue as mesmas regras do
        registo normal. Depois, a app entra com e-mail e palavra-passe e aceita
        o convite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, legalDocumentIds]
              properties:
                password:
                  type: string
                  minLength: 8
                  description: 8 a 72 bytes em UTF-8
                  writeOnly: true
                legalDocumentIds:
                  type: array
                  maxItems: 10
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: {type: string, format: email}
        default:
          $ref: '#/components/responses/Error'
  /v1/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      summary: Aceitar o convite com a conta atual
      description: >-
        Exige e-mail confirmado, PIN do responsável configurado e que o e-mail da
        conta seja o do convite. Não exige a área do responsável desbloqueada.
        Uma conta só pertence a uma família: se o adulto já estiver numa família
        com crianças, devolve 409 ALREADY_IN_FAMILY; famílias vazias são
        fechadas (ou abandonadas, se tiverem outros responsáveis). Idempotente
        para o mesmo adulto.
      responses:
        '200':
          description: Convite aceite
          content:
            application/json:
              schema:
                type: object
                required: [familyId]
                properties:
                  familyId: {type: string, format: uuid}
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    FamilyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: Token do link do e-mail (inv_ seguido de 64 hexadecimais)
      schema:
        type: string
        pattern: '^inv_[0-9a-f]{64}$'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
      description: Usar nextCursor da página anterior; ordenação por UUID crescente
  securitySchemes:
    parentUnlock:
      type: apiKey
      in: header
      name: X-Parent-Unlock
      description: Autorização temporária emitida após validar o PIN do responsável
    adultSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    projectKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    Family:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active]
        createdAt:
          type: string
          format: date-time
    Child:
      type: object
      required: [id, familyId, displayName, schoolYear, avatarId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        displayName:
          type: string
        schoolYear:
          type: integer
        avatarId:
          type: string
        createdAt:
          type: string
          format: date-time
        plan:
          type: string
          nullable: true
          enum: [premium, free, locked]
          description: >-
            Plano atual da criança (só para a área da família). Pode ser null em
            create/update se o plano não puder ser lido.
        subscription:
          type: object
          nullable: true
          description: Assinatura viva (só na listagem). Sem identificadores externos.
          properties:
            channel: {type: string, enum: [manual, stripe, google_play, app_store]}
            status: {type: string, enum: [active, in_grace]}
            autoRenew: {type: boolean}
            currentPeriodEnd: {type: string, format: date-time}
    FamilyMembers:
      type: object
      required: [members, invitations]
      properties:
        members:
          type: array
          items:
            type: object
            required: [adultUserId, email, joinedAt, isMe]
            properties:
              adultUserId: {type: string, format: uuid}
              email: {type: string, format: email}
              joinedAt: {type: string, format: date-time}
              isMe: {type: boolean}
        invitations:
          type: array
          description: Convites pendentes, incluindo expirados (expired true)
          items:
            type: object
            required: [id, email, createdAt, expiresAt, expired]
            properties:
              id: {type: string, format: uuid}
              email: {type: string, format: email}
              createdAt: {type: string, format: date-time}
              expiresAt: {type: string, format: date-time}
              expired: {type: boolean}
    InvitationPreview:
      type: object
      required: [status, email, expiresAt, accountExists]
      properties:
        status: {type: string, enum: [pending, accepted, expired]}
        email: {type: string, format: email}
        invitedBy:
          type: string
          format: email
          nullable: true
          description: E-mail de quem convidou (null se essa conta já não existir)
        expiresAt: {type: string, format: date-time}
        accountExists: {type: boolean}
  responses:
    Error:
      description: >-
        Erro padronizado. 400 pedido inválido; 401 sessão inválida;
        403 e-mail/PIN do responsável em falta ou INVITATION_EMAIL_MISMATCH;
        404 família, criança, responsável (MEMBER_NOT_FOUND) ou convite
        (INVITATION_INVALID) inacessível; 405 método não permitido;
        409 identificador reutilizado, ALREADY_MEMBER, MEMBER_LIMIT,
        ALREADY_IN_FAMILY, LAST_MEMBER ou ACCOUNT_EXISTS; 410 INVITATION_EXPIRED;
        413 pedido demasiado grande; 422 perfil inválido ou WEAK_PASSWORD;
        429 RATE_LIMITED; 503 serviço indisponível ou EMAIL_UNAVAILABLE;
        500 erro interno.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, requestId]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
                    format: uuid
