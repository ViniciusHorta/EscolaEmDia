<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

creen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-8 select-none">
<!-- Brand Header: Playful Tactile Floating Card -->
<div class="w-full bg-card-bg rounded-lg shadow-md p-space-md flex flex-col items-center text-center relative overflow-hidden mb-space-md">
<!-- Decorative Ambient Blobs -->
<div class="absolute -top-8 -right-8 w-24 h-24 rounded-full bg-lavender-subtle pointer-events-none opacity-60"></div>
<div class="absolute -bottom-8 -left-8 w-20 h-20 rounded-full bg-coral-subtle pointer-events-none opacity-50"></div>
<!-- Mascot & Sparkle Badge -->
<div class="relative mb-space-xs mt-1">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[36px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>
<div class="absolute -top-1 -right-2 w-7 h-7 rounded-full bg-sun-yellow text-on-secondary-fixed flex items-center justify-center shadow-xs animate-bounce">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Brand Titles -->
<div class="flex items-center gap-1.5 justify-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Escola em Dia</h1>
<span class="material-symbols-outlined text-mint-green text-[20px]" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[260px] mt-0.5">
      Apoio escolar sereno em família
    </p>
<!-- Friendly Badge Tag -->

</div>
<!-- Visual Value Highlights (Bento Carousel / Cards) -->

<!-- Interactive Parent Sign-In / Register Form Box -->
<div class="bg-card-bg rounded-lg p-space-md shadow-md flex flex-col relative">
<!-- Tactile Mode Segmented Switch -->
<div class="bg-surface-container-low p-1 rounded-full flex items-center mb-space-md">
<button class="flex-1 py-2 rounded-full font-label-md text-label-md text-center bg-card-bg text-primary shadow-xs transition-all flex items-center justify-center gap-1.5" id="tab-create" onclick="switchAuthTab('create')" type="button">
<span class="material-symbols-outlined text-[18px]">family_star</span>
<span class="">Criar Conta</span>
</button>
<button class="flex-1 py-2 rounded-full font-label-md text-label-md text-center text-on-surface-variant hover:text-on-surface transition-all flex items-center justify-center gap-1.5" id="tab-login" onclick="switchAuthTab('login')" type="button">
<span class="material-symbols-outlined text-[18px]">login</span>
<span class="">Já tenho conta</span>
</button>
</div>
<form class="flex flex-col gap-3.5" onsubmit="event.preventDefault(); triggerSubmitFeedback();">
<!-- Input Email -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between px-1" for="parent-email">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-primary">mail</span>
<span class="">E-mail do encarregado de educação</span>
</span>

</label>
<div class="relative flex items-center">
<input class="w-full bg-cream-bg text-on-surface placeholder:text-outline font-body-md text-body-md rounded-full px-4 py-3 outline-none focus:bg-card-bg focus:shadow-sm transition-all" id="parent-email" placeholder="exemplo: mae.maria@email.pt" required="" type="email">
</div>
</div>
<!-- Input Password -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1" for="parent-pass">
<span class="material-symbols-outlined text-[16px] text-primary">key</span>
<span class="">Palavra-passe segura</span>
</label>
<button class="hidden font-label-sm text-label-sm text-primary hover:underline active:text-lavender-press" id="forgot-password-link" type="button">
            Esqueceu-se do acesso?
          </button>
</div>
<div class="relative flex items-center">
<input class="w-full bg-cream-bg text-on-surface placeholder:text-outline font-body-md text-body-md rounded-full px-4 py-3 pr-11 outline-none focus:bg-card-bg focus:shadow-sm transition-all" id="parent-pass" placeholder="Mínimo 8 carateres" required="" type="password">
<button aria-label="Ver palavra-passe" class="absolute right-3.5 p-1 rounded-full text-outline hover:text-on-surface active:scale-95 transition-all flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pass-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Trust Assurance Mini-Pill -->

<!-- Tactile 3D Button (Duolingo Style: border-b-4 press effect) -->
<div class="flex items-start gap-2 px-1 py-1"><input id="terms-checkbox" type="checkbox" required="" class="mt-1 w-4 h-4 rounded text-primary focus:ring-primary cursor-pointer" checked=""><label for="terms-checkbox" class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none leading-tight">Li e aceito os <a href="#" class="text-primary font-label-sm hover:underline">Termos de Utilização</a> e a <a href="#" class="text-primary font-label-sm hover:underline">Política de Privacidade</a>.</label></div><button class="w-full mt-2 py-3.5 px-6 rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md transition-all active:translate-y-1 active:shadow-xs active:bg-lavender-press cursor-pointer select-none" id="submit-cta" style="box-shadow: rgb(67, 43, 180) 0px 4px 0px 0px;" type="submit"><span id="cta-label" class="font-label-lg">Continuar para Configuração Familiar</span><span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span></button>
</form>
<!-- Social Authentication Divider -->
<div class="relative flex py-3 items-center mt-3">
<div class="flex-grow bg-surface-variant h-[1px]"></div>
<span class="flex-shrink mx-3 text-on-surface-variant font-label-sm text-label-sm">ou acesso imediato</span>
<div class="flex-grow bg-surface-variant h-[1px]"></div>
</div>
<!-- Social Authentication Buttons with Soft Borders & Tactile Touch -->
<div class="flex flex-col gap-2.5"><div class="grid grid-cols-2 gap-3"><button type="button" class="w-full py-2.5 px-3 rounded-full bg-cream-bg text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 shadow-xs transition-all active:translate-y-0.5 active:bg-surface-container" style="box-shadow: 0 2px 0 0 #d5e3fc;"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.67-1.09 1.74-.95 2.77 1.01.08 2.05-.52 2.68-1.27z"></path></svg><span class="">Apple</span></button><button type="button" class="w-full py-2.5 px-3 rounded-full bg-cream-bg text-on-surface font-label-md text-label-md flex items-center justify-center gap-2 shadow-xs transition-all active:translate-y-0.5 active:bg-surface-container" style="box-shadow: 0 2px 0 0 #d5e3fc;"><svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path></svg><span class="">Google</span></button></div></div>
</div>
<!-- Trust & Regulatory Footer -->
<div class="mt-space-md flex flex-col items-center text-center px-2"><div class="flex items-center gap-1.5 text-on-surface-variant opacity-60"><span class="material-symbols-outlined text-[16px]">lock</span><span class="font-label-sm text-label-sm">Ambiente seguro • Privacidade das famílias em Portugal</span></div></div>
</div>
<script>
  function switchAuthTab(mode) {
    const tabCreate = document.getElementById('tab-create');
    const tabLogin = document.getElementById('tab-login');
    const forgotLink = document.getElementById('forgot-password-link');
    const ctaLabel = document.getElementById('cta-label');

    if (mode === 'create') {
      tabCreate.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-center bg-card-bg text-primary shadow-xs transition-all flex items-center justify-center gap-1.5';
      tabLogin.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-center text-on-surface-variant hover:text-on-surface transition-all flex items-center justify-center gap-1.5';
      forgotLink.classList.add('hidden');
      ctaLabel.textContent = 'Continuar para Configuração Familiar';
    } else {
      tabLogin.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-center bg-card-bg text-primary shadow-xs transition-all flex items-center justify-center gap-1.5';
      tabCreate.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-center text-on-surface-variant hover:text-on-surface transition-all flex items-center justify-center gap-1.5';
      forgotLink.classList.remove('hidden');
      ctaLabel.textContent = 'Entrar na Escola em Dia';
    }
  }

  function togglePasswordVisibility() {
    const passInput = document.getElementById('parent-pass');
    const eyeIcon = document.getElementById('pass-eye-icon');
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function triggerSubmitFeedback() {
    const btn = document.getElementById('submit-cta');
    const originalText = document.getElementById('cta-label').textContent;
    btn.style.transform = 'translateY(3px)';
    btn.style.boxShadow = '0 1px 0 0 #6454D6';
    document.getElementById('cta-label').textContent = 'A preparar ambiente...';
    setTimeout(() => {
      btn.style.transform = '';
      btn.style.boxShadow = '0 4px 0 0 #6454D6';
      document.getElementById('cta-label').textContent = originalText;
    }, 1200);
  }
</script></main>



</body></html>
