<div class="px-space-md py-space-sm flex flex-col gap-space-xs"><div class="w-full bg-surface-container rounded-full h-2 flex items-center p-0.5 gap-1"><div class="h-1.5 rounded-full bg-mint-green flex-1 transition-all"></div><div class="h-1.5 rounded-full bg-mint-green flex-1 transition-all"></div><div class="h-1.5 rounded-full bg-mint-green flex-1 transition-all"></div><div class="h-1.5 rounded-full bg-mint-green flex-1 transition-all"></div><div class="h-1.5 rounded-full bg-primary flex-1 transition-all"></div><div class="h-1.5 rounded-full bg-surface-container-highest flex-1 transition-all"></div></div></div>
<div class="px-space-md flex flex-col gap-space-md mt-2">
<!-- Cartão do Enunciado e Contexto -->
<div class="rounded-lg bg-surface-container-lowest p-space-md shadow-md flex flex-col gap-space-sm relative overflow-hidden"><div class="relative w-full h-32 rounded-DEFAULT bg-surface-container-low overflow-hidden flex items-center justify-center"><img class="w-full h-full object-cover" data-alt="Pomar de macieiras" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqyC_xbfR9u9xYHAO1ALgxQ6_hxUtX0fYJhRN3kNttI81Qb-pdIuD0vLEy_yRlHe_jwwbu3SZlOs37dBrCrTrOUKbQ6EeP1f1mxK1FkzJqVDuq9GvcBYpt5WW0Zlh24P0eXa7ALx3FxIF2hVocvvDnhOtAfzQqvS8tZrL0B6cM8ewp0E16tmMI8M9hc6VfFHS5YqFz_6_3oBcb2l4T1XowmZOpiSa_LQxnm_BnKUYx"><div class="absolute inset-0 bg-gradient-to-t from-surface-container-low via-transparent to-transparent opacity-60"></div></div><div class="flex flex-col gap-1.5"><h2 class="font-headline-md text-headline-md text-on-surface leading-snug">O Desafio das Maçãs 🍎</h2><p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">Num pomar, colheram-se <strong class="text-primary font-bold">24 maçãs</strong> e foram distribuídas igualmente por <strong class="text-primary font-bold">4 cestos</strong>. Explica como descobriste quantas maçãs ficaram em cada cesto.</p></div></div>
<!-- Seletor Tátil de Modo de Resposta -->
<div class="flex flex-col gap-space-xs"><div class="grid grid-cols-2 gap-2 p-1.5 bg-surface-container-high rounded-full border border-outline-variant/30 shadow-inner"><button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-[0_3px_0_#432bb4] active:translate-y-0.5 active:shadow-[0_1px_0_#432bb4] transition-all cursor-pointer" id="tab-digital" onclick="selectMode('digital')" type="button"><span class="material-symbols-outlined text-[18px]">edit</span><span class="">Escrever aqui</span></button><button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md shadow-[0_3px_0_#c9c4d6] hover:bg-surface-container active:translate-y-0.5 active:shadow-[0_1px_0_#c9c4d6] transition-all cursor-pointer" id="tab-paper" onclick="selectMode('paper')" type="button"><span class="material-symbols-outlined text-[18px]">edit_note</span><span class="">No caderno 📝</span></button></div></div>
<!-- Modo 1: Escrever no Ecrã (Ativo por Padrão) -->

<!-- Modo 2: No Caderno / Papel e Lápis (Oculto inicialmente) -->
<div class="flex-col gap-space-sm hidden" id="content-paper"><div class="rounded-lg bg-surface-container-lowest p-space-md shadow-md flex flex-col gap-space-md"><label class="flex items-center gap-3 p-space-sm rounded-DEFAULT bg-surface-container-low cursor-pointer active:scale-[0.99] transition-transform"><input checked="" class="w-6 h-6 rounded-md accent-mint-green cursor-pointer" id="check-notebook" type="checkbox"><span class="font-label-md text-label-md text-on-surface">Já resolvi o desafio no meu caderno ✓</span></label></div></div>
<!-- Mensagem Afetuosa e Tranquilizadora (Sem Pressão / Sem IA) -->

<div class="mt-2 flex flex-col gap-2"><div class="grid grid-cols-2 gap-3 pt-2"><button class="w-full py-3.5 px-space-md rounded-full bg-surface-container-lowest border border-outline-variant/30 text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_4px_0_#c9c4d6] hover:bg-surface-container active:translate-y-1 active:shadow-none transition-all cursor-pointer" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span><span class="">Anterior</span></button><button class="w-full py-3.5 px-space-md rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_4px_0_#432bb4] hover:bg-lavender-press active:translate-y-1 active:shadow-none transition-all cursor-pointer" id="btn-next" type="button"><span class="">Última pergunta</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></div>
</div>
</div>
<script>
  function selectMode(mode) {
    const btnDigital = document.getElementById('tab-digital');
    const btnPaper = document.getElementById('tab-paper');
    const contentDigital = document.getElementById('content-digital');
    const contentPaper = document.getElementById('content-paper');

    if (mode === 'digital') {
      btnDigital.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all";
      btnPaper.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-full text-on-surface-variant hover:bg-surface-container font-label-md text-label-md transition-all";
      
      contentDigital.classList.remove('hidden');
      contentDigital.classList.add('flex');
      contentPaper.classList.remove('flex');
      contentPaper.classList.add('hidden');
    } else {
      btnPaper.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all";
      btnDigital.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-full text-on-surface-variant hover:bg-surface-container font-label-md text-label-md transition-all";
      
      contentPaper.classList.remove('hidden');
      contentPaper.classList.add('flex');
      contentDigital.classList.remove('flex');
      contentDigital.classList.add('hidden');
    }
  }

  function updateCount(el) {
    const counter = document.getElementById('char-count');
    if (counter) {
      counter.textContent = el.value.length + " caracteres";
    }
  }

  function insertSnippet(text) {
    const textarea = document.getElementById('answer-input');
    if (!textarea) return;
    if (textarea.value.trim() === '') {
      textarea.value = text;
    } else {
      textarea.value = textarea.value + " " + text;
    }
    updateCount(textarea);
    textarea.focus();
  }

  function clearText() {
    const textarea = document.getElementById('answer-input');
    if (!textarea) return;
    textarea.value = '';
    updateCount(textarea);
  }

  function skipQuestion() {
    const skipBtn = document.getElementById('btn-skip');
    if (skipBtn) {
      skipBtn.classList.add('opacity-75');
      setTimeout(() => {
        skipBtn.classList.remove('opacity-75');
      }, 300);
    }
  }

  const pauseBtn = document.getElementById('btn-pause-save');
  if (pauseBtn) {
    pauseBtn.addEventListener('click', () => {
      pauseBtn.classList.add('bg-mint-green', 'text-on-primary');
      setTimeout(() => {
        pauseBtn.classList.remove('bg-mint-green', 'text-on-primary');
      }, 1000);
    });
  }
</script></main>
