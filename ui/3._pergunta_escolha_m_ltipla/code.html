<!DOCTYPE html>

<html lang="pt-PT"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "lavender-subtle": "#EDE9FE", "primary-fixed-dim": "#c7bfff", "inverse-primary": "#c7bfff", "tertiary-fixed": "#87fe45", "outline-variant": "#c9c4d6", "lavender-press": "#6454D6", "on-background": "#0d1c2e", "tertiary-container": "#378500", "cream-bg": "#F8FAFC", "secondary-fixed-dim": "#ffb95f", "surface-container-highest": "#d5e3fc", "inverse-on-surface": "#eaf1ff", "surface": "#f8f9ff", "outline": "#787585", "mint-green": "#10B981", "surface-container-low": "#eff4ff", "secondary": "#855300", "surface-container-lowest": "#ffffff", "on-surface": "#0d1c2e", "tertiary-fixed-dim": "#6be026", "surface-container-high": "#dce9ff", "surface-container": "#e6eeff", "secondary-container": "#fea619", "inverse-surface": "#233144", "error-container": "#ffdad6", "surface-dim": "#ccdbf3", "on-secondary-container": "#684000", "on-primary-fixed": "#180065", "primary": "#5845ca", "on-tertiary-fixed-variant": "#1f5100", "on-error": "#ffffff", "on-primary-container": "#fffbff", "duo-green-dark": "#46A302", "peach-coral": "#FF7A59", "on-error-container": "#93000a", "on-primary-fixed-variant": "#432bb4", "surface-bright": "#f8f9ff", "surface-variant": "#d5e3fc", "surface-tint": "#5b48cd", "on-tertiary-container": "#f8ffed", "sky-blue": "#1CB0F6", "on-primary": "#ffffff", "on-secondary-fixed-variant": "#653e00", "on-secondary": "#ffffff", "background": "#f8f9ff", "secondary-fixed": "#ffddb8", "card-bg": "#FFFFFF", "on-surface-variant": "#64748B", "coral-subtle": "#FFE5DF", "on-secondary-fixed": "#2a1700", "yellow-press": "#D97706", "on-tertiary-fixed": "#082100", "on-tertiary": "#ffffff", "primary-fixed": "#e5deff", "sun-yellow": "#FBBF24", "error": "#ba1a1a", "tertiary": "#2a6900", "primary-container": "#7260e5" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, fontFamily: { sans: ["Lexend", "sans-serif"] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;font-family:'Lexend',sans-serif;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,16px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-[#F8FAFD] text-[#0F172A] flex flex-col min-h-screen select-none antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 pt-safe bg-[#F8FAFD]/90 backdrop-blur-md">
<div class="h-16 px-4 flex items-center justify-between gap-3">
<!-- Pause Circular Pill Button with 3D tactile bottom shadow -->
<button aria-label="Pausar" class="w-11 h-11 rounded-full bg-[#EEF2F6] hover:bg-[#E2E8F0] text-[#5845ca] flex items-center justify-center shadow-[0_3px_0_#CBD5E1] active:shadow-none active:translate-y-[3px] transition-all shrink-0" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">pause_circle</span>
</button>
<!-- Center Title & Status Badge -->
<div class="flex-1 flex flex-col items-center justify-center text-center px-1 overflow-hidden">
<span class="font-extrabold text-[17px] text-[#0F172A] leading-tight truncate max-w-[230px]">Pergunta Escolha Múltipla</span>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="w-2 h-2 rounded-full bg-[#10B981] inline-block animate-pulse"></span>
<span class="font-semibold text-[12px] text-[#64748B]">Sem pressa, com calma</span>
</div>
</div>
<!-- User Avatar Circular Pill -->
<div class="w-10 h-10 rounded-full bg-[#5845ca] text-white flex items-center justify-center shadow-[0_3px_0_#3b289a] shrink-0">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
</div>
</header>
<!-- Main Scrollable Content -->
<main class="flex flex-col relative w-full pt-16 pb-24 bg-[#F8FAFD] min-h-screen">
<div class="flex flex-col w-full px-4 pt-3 gap-4">
<!-- Question Statement Card -->
<div class="bg-white rounded-[2rem] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-[#EDF2F7]">
<h1 class="font-extrabold text-[22px] md:text-[24px] text-[#0F172A] leading-snug tracking-tight">
          A Rita dividiu uma piza redonda em <strong class="text-[#5845ca] font-extrabold">4 fatias iguais</strong> e comeu <strong class="text-[#5845ca] font-extrabold">1 fatia</strong>. Que fração da piza comeu a Rita?
        </h1>
</div>
<!-- Pizza Illustration Card -->
<div class="bg-white rounded-[2rem] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-[#EDF2F7] flex flex-col items-center justify-center relative">
<div class="relative w-48 h-48 flex items-center justify-center">
<svg aria-label="Desenho de uma piza dividida em 4 partes iguais com 1 fatia retirada" class="w-full h-full drop-shadow-sm select-none" viewbox="0 0 200 200">
<!-- Top-Left slice (Normal) -->
<path d="M 100 100 L 25 100 A 75 75 0 0 1 100 25 Z" fill="#FED7AA"></path>
<circle cx="65" cy="65" fill="#FB923C" opacity="0.85" r="4.5"></circle>
<circle cx="78" cy="50" fill="#34D399" opacity="0.75" r="3.5"></circle>
<!-- Bottom-Left slice (Normal) -->
<path d="M 100 100 L 100 175 A 75 75 0 0 1 25 100 Z" fill="#FDBA74"></path>
<circle cx="65" cy="135" fill="#FB923C" opacity="0.85" r="4.5"></circle>
<circle cx="50" cy="115" fill="#34D399" opacity="0.75" r="3.5"></circle>
<!-- Bottom-Right slice (Normal) -->
<path d="M 100 100 L 175 100 A 75 75 0 0 1 100 175 Z" fill="#FED7AA"></path>
<circle cx="135" cy="135" fill="#FB923C" opacity="0.85" r="4.5"></circle>
<circle cx="120" cy="150" fill="#34D399" opacity="0.75" r="3.5"></circle>
<!-- Division borders -->
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3" x1="25" x2="100" y1="100" y2="100"></line>
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3" x1="100" x2="100" y1="25" y2="100"></line>
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3" x1="100" x2="100" y1="100" y2="175"></line>
<line stroke="#FFFFFF" stroke-linecap="round" stroke-width="3" x1="100" x2="175" y1="100" y2="100"></line>
<!-- Top-Right Slice Highlighted (Rita's slice) -->
<g transform="translate(10, -10)">
<path d="M 100 100 L 100 25 A 75 75 0 0 1 175 100 Z" fill="#5845ca"></path>
<circle cx="135" cy="65" fill="#DDD6FE" r="5"></circle>
<circle cx="120" cy="48" fill="#FDE047" r="4"></circle>
<circle cx="150" cy="85" fill="#FFFFFF" opacity="0.8" r="4"></circle>
</g>
</svg>
<!-- Tactile Badge "1 fatia" -->
<div class="absolute top-1 right-2 bg-[#5845ca] text-white font-bold text-[13px] px-3 py-1 rounded-full shadow-[0_2px_0_#3b289a] flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px]">restaurant</span>
<span>1 fatia</span>
</div>
</div>
</div>
<!-- Multiple Choice Options (Standardized Rounded-Full Pill Buttons with 3D tactile elevation) -->
<fieldset class="flex flex-col gap-3.5 pt-1">
<legend class="sr-only">Escolhe uma das quatro opções de fração</legend>
<!-- Option A (Standard Pill, Tactile 3D bottom shadow) -->
<label class="group relative flex items-center justify-between px-5 py-3.5 bg-white rounded-full border border-[#E2E8F0] shadow-[0_4px_0_#E2E8F0] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer">
<input class="sr-only peer" name="math_fraction_answer" type="radio" value="1/2"/>
<div class="flex items-center gap-4 min-w-0">
<span class="w-10 h-10 rounded-full bg-[#EBF2FE] text-[#1E293B] font-bold text-[18px] flex items-center justify-center shrink-0">
              A
            </span>
<div class="flex flex-col">
<span class="font-extrabold text-[20px] text-[#0F172A] leading-tight tracking-wide">1/2</span>
<span class="font-medium text-[13px] text-[#64748B]">metade da piza</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#F1F5F9] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-transparent">check</span>
</div>
</label>
<!-- Option B (Selected/Active Pill, Lavender fill, tactile 3D purple bottom shadow) -->
<label class="group relative flex items-center justify-between px-5 py-3.5 bg-[#EDE9FE] rounded-full border border-[#C4B5FD] shadow-[0_4px_0_#A78BFA] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer">
<input checked="" class="sr-only peer" name="math_fraction_answer" type="radio" value="1/4"/>
<div class="flex items-center gap-4 min-w-0">
<span class="w-10 h-10 rounded-full bg-[#5845ca] text-white font-bold text-[18px] flex items-center justify-center shrink-0 shadow-[0_2px_0_#3b289a]">
              B
            </span>
<div class="flex flex-col">
<span class="font-extrabold text-[20px] text-[#5845ca] leading-tight tracking-wide">1/4</span>
<span class="font-bold text-[13px] text-[#1E293B]">uma parte de quatro</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#5845ca] text-white flex items-center justify-center shrink-0 shadow-[0_2px_0_#3b289a]">
<span class="material-symbols-outlined text-[20px] font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
<!-- Option C (Standard Pill, Tactile 3D bottom shadow) -->
<label class="group relative flex items-center justify-between px-5 py-3.5 bg-white rounded-full border border-[#E2E8F0] shadow-[0_4px_0_#E2E8F0] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer">
<input class="sr-only peer" name="math_fraction_answer" type="radio" value="2/4"/>
<div class="flex items-center gap-4 min-w-0">
<span class="w-10 h-10 rounded-full bg-[#EBF2FE] text-[#1E293B] font-bold text-[18px] flex items-center justify-center shrink-0">
              C
            </span>
<div class="flex flex-col">
<span class="font-extrabold text-[20px] text-[#0F172A] leading-tight tracking-wide">2/4</span>
<span class="font-medium text-[13px] text-[#64748B]">duas partes de quatro</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#F1F5F9] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-transparent">check</span>
</div>
</label>
<!-- Option D (Standard Pill, Tactile 3D bottom shadow) -->
<label class="group relative flex items-center justify-between px-5 py-3.5 bg-white rounded-full border border-[#E2E8F0] shadow-[0_4px_0_#E2E8F0] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer">
<input class="sr-only peer" name="math_fraction_answer" type="radio" value="3/4"/>
<div class="flex items-center gap-4 min-w-0">
<span class="w-10 h-10 rounded-full bg-[#EBF2FE] text-[#1E293B] font-bold text-[18px] flex items-center justify-center shrink-0">
              D
            </span>
<div class="flex flex-col">
<span class="font-extrabold text-[20px] text-[#0F172A] leading-tight tracking-wide">3/4</span>
<span class="font-medium text-[13px] text-[#64748B]">três partes de quatro</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-[#F1F5F9] flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-transparent">check</span>
</div>
</label>
</fieldset>
</div>
</main>
<!-- Bottom Navigation Bar (Fixed with Duolingo/Edulite Tactile Pill Buttons) -->
<footer class="fixed bottom-0 left-0 right-0 z-50 px-4 pt-3 pb-safe bg-[#F8FAFD]/95 backdrop-blur-md border-t border-[#EEF2F6]">
<div class="flex items-center justify-between gap-3 max-w-lg mx-auto w-full mb-2">
<!-- 'Anterior' Button: rounded-full pill with tactile 3D shadow (0 4px 0 #d0d7e5) -->
<button class="h-[52px] px-6 rounded-full bg-white text-[#1E293B] border border-[#CBD5E1] shadow-[0_4px_0_#d0d7e5] active:shadow-none active:translate-y-[4px] transition-all flex items-center justify-center gap-2 font-bold text-[15px] cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span>Anterior</span>
</button>
<!-- 'Seguinte' Button: rounded-full pill with tactile 3D purple shadow (0 4px 0 #3b289a) -->
<button class="h-[52px] flex-1 px-6 rounded-full bg-[#5845ca] text-white shadow-[0_4px_0_#3b289a] active:shadow-none active:translate-y-[4px] hover:brightness-105 transition-all flex items-center justify-center gap-2 font-bold text-[16px] cursor-pointer" type="button">
<span>Seguinte</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</footer>
<!-- Micro-interaction Selection Logic -->
<script>
    document.querySelectorAll('input[name="math_fraction_answer"]').forEach((input) => {
      input.addEventListener('change', () => {
        document.querySelectorAll('label').forEach((label) => {
          const radio = label.querySelector('input[type="radio"]');
          if (!radio) return;

          const letterBadge = label.querySelector('span.w-10');
          const checkBadge = label.querySelector('div.w-8');
          const checkIcon = checkBadge ? checkBadge.querySelector('.material-symbols-outlined') : null;
          const textTitle = label.querySelector('.font-extrabold.text-\\[20px\\]');
          const textSubtitle = label.querySelector('.text-\\[13px\\]');

          if (radio.checked) {
            label.className = "group relative flex items-center justify-between px-5 py-3.5 bg-[#EDE9FE] rounded-full border border-[#C4B5FD] shadow-[0_4px_0_#A78BFA] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer";
            if (letterBadge) {
              letterBadge.className = "w-10 h-10 rounded-full bg-[#5845ca] text-white font-bold text-[18px] flex items-center justify-center shrink-0 shadow-[0_2px_0_#3b289a]";
            }
            if (textTitle) {
              textTitle.className = "font-extrabold text-[20px] text-[#5845ca] leading-tight tracking-wide";
            }
            if (textSubtitle) {
              textSubtitle.className = "font-bold text-[13px] text-[#1E293B]";
            }
            if (checkBadge) {
              checkBadge.className = "w-8 h-8 rounded-full bg-[#5845ca] text-white flex items-center justify-center shrink-0 shadow-[0_2px_0_#3b289a]";
            }
            if (checkIcon) {
              checkIcon.className = "material-symbols-outlined text-[20px] font-bold";
              checkIcon.style.fontVariationSettings = "'FILL' 1";
            }
          } else {
            label.className = "group relative flex items-center justify-between px-5 py-3.5 bg-white rounded-full border border-[#E2E8F0] shadow-[0_4px_0_#E2E8F0] active:shadow-none active:translate-y-[4px] transition-all cursor-pointer";
            if (letterBadge) {
              letterBadge.className = "w-10 h-10 rounded-full bg-[#EBF2FE] text-[#1E293B] font-bold text-[18px] flex items-center justify-center shrink-0";
            }
            if (textTitle) {
              textTitle.className = "font-extrabold text-[20px] text-[#0F172A] leading-tight tracking-wide";
            }
            if (textSubtitle) {
              textSubtitle.className = "font-medium text-[13px] text-[#64748B]";
            }
            if (checkBadge) {
              checkBadge.className = "w-8 h-8 rounded-full bg-[#F1F5F9] flex items-center justify-center shrink-0";
            }
            if (checkIcon) {
              checkIcon.className = "material-symbols-outlined text-[18px] text-transparent";
              checkIcon.style.fontVariationSettings = "'FILL' 0";
            }
          }
        });
      });
    });
  </script>
</body></html>
