<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Escola em Dia — estudo em família.">
  <meta name="theme-color" content="#5845CA">
  <title>Escola em Dia</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FBF9FF; }
    /* Splash até ao primeiro frame do Flutter; igual ao splash nativo e ao AppSplash. */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #FBF9FF; transition: opacity 250ms ease-out; z-index: 1; }
    #splash img { width: 120px; height: 120px; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-512.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
